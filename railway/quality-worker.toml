# Railway Config-as-Code for the isolated transcription-quality worker.
# Dashboard contract: Root Directory=/lyricgen,
# Config File=/railway/quality-worker.toml.
#
# QUEUES is pinned in startCommand (instead of relying on a dashboard variable)
# so this service can never consume transcription, preview, or render work.
# One RQ Worker process handles one job at a time; numReplicas=1 therefore caps
# quality analysis at exactly one concurrent job for the initial CPU rollout.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = [
    "lyricgen/backend/**",
    "lyricgen/assets/**",
    "lyricgen/Dockerfile.worker",
    "railway/quality-worker.toml",
]

[deploy]
startCommand = "sh -c 'python backend/scripts/require_worker_schema.py && python backend/scripts/require_quality_worker_resources.py && env TRANSCRIPTION_QUALITY_MODE=observe TRANSCRIPTION_QUALITY_QUEUE_ENABLED=1 QUEUES=transcription_quality python backend/scripts/require_quality_worker_config.py && exec env TRANSCRIPTION_QUALITY_MODE=observe TRANSCRIPTION_QUALITY_QUEUE_ENABLED=1 QUEUES=transcription_quality python backend/worker.py'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
drainingSeconds = 1200

# Railway Config-as-Code for the isolated transcription-quality worker.
# Dashboard contract: Root Directory=/lyricgen,
# Config File=/railway/quality-worker.toml.
#
# QUEUES is pinned in startCommand (instead of relying on a dashboard variable)
# so this service can never consume transcription, preview, or render work.
# One RQ Worker process handles one job at a time; numReplicas=1 therefore caps
# quality analysis at exactly one concurrent job for the initial CPU rollout.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = [
    "lyricgen/backend/**",
    "lyricgen/assets/**",
    "lyricgen/Dockerfile.worker",
    "railway/quality-worker.toml",
]

[deploy]
startCommand = "sh -c 'export QUALITY_V6_PROPOSALS_ENABLED=\"${QUALITY_V6_PROPOSALS_ENABLED:-0}\" QUALITY_V6_MODEL_ENABLED=\"${QUALITY_V6_MODEL_ENABLED:-0}\" TARGETED_CONSENSUS_MAX_BILLED_SECONDS=\"${TARGETED_CONSENSUS_MAX_BILLED_SECONDS:-120}\"; python backend/scripts/require_worker_schema.py && python backend/scripts/require_quality_worker_resources.py && env QUALITY_CONTENT_FINGERPRINT_HMAC_KEY_ID=quality-v6-2026-01 TRANSCRIPTION_QUALITY_MODE=observe TRANSCRIPTION_QUALITY_QUEUE_ENABLED=1 QUALITY_V6_ANALYSIS_ENABLED=1 PERFORMANCE_GRAPH_V6_ENABLED=1 TARGETED_CONSENSUS_ENABLED=1 TARGETED_ACOUSTIC_STRUCTURE_ENABLED=1 TARGETED_SLOW_STEM_ENABLED=1 TARGETED_GEMINI_VERIFY_ENABLED=1 TARGETED_STRUCTURAL_AUTOREPAIR_MODE=observe TARGETED_RESIDUAL_ASR_ENABLED=1 QUEUES=transcription_quality python backend/scripts/require_quality_worker_config.py && exec env QUALITY_CONTENT_FINGERPRINT_HMAC_KEY_ID=quality-v6-2026-01 TRANSCRIPTION_QUALITY_MODE=observe TRANSCRIPTION_QUALITY_QUEUE_ENABLED=1 QUALITY_V6_ANALYSIS_ENABLED=1 PERFORMANCE_GRAPH_V6_ENABLED=1 TARGETED_CONSENSUS_ENABLED=1 TARGETED_ACOUSTIC_STRUCTURE_ENABLED=1 TARGETED_SLOW_STEM_ENABLED=1 TARGETED_GEMINI_VERIFY_ENABLED=1 TARGETED_STRUCTURAL_AUTOREPAIR_MODE=observe TARGETED_RESIDUAL_ASR_ENABLED=1 QUEUES=transcription_quality python backend/worker.py'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
drainingSeconds = 1200

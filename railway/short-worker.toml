# Railway Config-as-Code for the latency-sensitive worker fleet.
# Dashboard contract: Root Directory=/lyricgen,
# Config File=/railway/short-worker.toml, QUEUES=transcription,bg_preview,audio_preview and
# RAILWAY_SHUTDOWN_TIMEOUT_SECONDS=1200.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = [
    "lyricgen/backend/**",
    "lyricgen/assets/**",
    "lyricgen/Dockerfile.worker",
    "railway/short-worker.toml",
]

[deploy]
startCommand = "sh -c 'python backend/scripts/require_worker_schema.py && exec env QUEUES=transcription,bg_preview,audio_preview python backend/worker.py'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 3
drainingSeconds = 1200

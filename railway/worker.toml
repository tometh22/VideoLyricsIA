# Railway Config-as-Code for the heavy render worker fleet.
# Dashboard contract: Root Directory=/lyricgen, Config File=/railway/worker.toml,
# QUEUES=enterprise,default,canary and RAILWAY_SHUTDOWN_TIMEOUT_SECONDS=1200.
#
# OVH (deploy/ovh) splits this fleet: render listens to enterprise,canary,
# a light process listens only to default, and ProRes has its own workers.
# Do not drop `default` from this command until that migration. This process
# is still the only consumer of `default` on Railway, and a toml file does
# not create the extra service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
# Shared runtime cohort: the quality CAS token includes the Git release SHA.
# Keep these repository-root triggers identical across API and all five workers.
watchPatterns = [
    "/VERSION",
    "lyricgen/backend/**",
    "lyricgen/frontend/**",
    "lyricgen/assets/**",
    "lyricgen/Dockerfile",
    "lyricgen/Dockerfile.worker",
    "railway/api.toml",
    "railway/worker.toml",
    "railway/short-worker.toml",
    "railway/batch-worker.toml",
    "railway/batch-short-worker.toml",
    "railway/quality-worker.toml",
]

[deploy]
startCommand = "sh -c 'python backend/scripts/require_worker_schema.py && exec env QUEUES=enterprise,default,canary python backend/worker.py'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 7
drainingSeconds = 1200

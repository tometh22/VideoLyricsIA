# Railway Config-as-Code for the FastAPI service.
# Dashboard contract: Root Directory=/lyricgen, Config File=/railway/api.toml.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
    "lyricgen/backend/**",
    "lyricgen/frontend/**",
    "lyricgen/assets/**",
    "lyricgen/Dockerfile",
    "railway/api.toml",
]

[deploy]
preDeployCommand = ["bash /app/backend/scripts/prod_migrate.sh"]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2 --app-dir /app/backend"
healthcheckPath = "/health/ready"
healthcheckTimeout = 90
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 2
drainingSeconds = 1200

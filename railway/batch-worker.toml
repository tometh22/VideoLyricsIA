# Dedicated render capacity. It cannot consume interactive render queues.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"
watchPatterns = [
    "lyricgen/backend/**",
    "lyricgen/assets/**",
    "lyricgen/Dockerfile.worker",
    "railway/batch-worker.toml",
]

[deploy]
startCommand = "sh -c 'python backend/scripts/require_worker_schema.py && exec env WORKLOAD_CLASS=batch QUEUES=batch_render python backend/worker.py'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 2
drainingSeconds = 1200

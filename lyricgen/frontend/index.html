         no-cache, no-store, must-revalidate para este HTML (ver

         hash de JS viejo después de un deploy y el user ve UI rota
         hasta hacer hard-refresh. Bug observado el 2026-05-13 con un

         servía index-KHXUzRn0.js. -->

    <!-- §10 Logo implementation — single source of truth. The favicon
         uses the G mark only (per the brand kit rules); the navbar /
         footer / auth screens use the full lockup. PNG variants cover
         every browser/device; .ico catches naive GET /favicon.ico hits
         (avoids the SPA fallback returning index.html as a "favicon");
         apple-touch-icon is what iOS Safari uses for "Add to Home
         Screen". SVG is a base64-wrapped PNG so SVG-preferring browsers
         render the same image as the PNG fallback (the prior hand-coded
         vector SVG was a different earlier design without the blue
         dot). -->
    <link rel="icon" type="image/svg+xml" href="/brand/genly-icon-color.svg" />
    <link rel="shortcut icon" href="/brand/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <!-- Google Fonts for the lyric-video font picker preview. The 8 families
         here mirror the backend's _FONT_CATALOGUE so what the operator sees
         in the dropdown is exactly what the worker renders. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Fredoka:wght@600&family=Jost:wght@700&family=Montserrat:wght@700;800&family=Nunito:wght@800&family=Outfit:wght@700&family=Oswald:wght@700&family=Poppins:wght@700&family=Quicksand:wght@700&family=Roboto:wght@700&display=swap" rel="stylesheet">
    <!-- 2026-05-30 perf: pre-warm the TCP/TLS connection to the backend
         BEFORE the React bundle finishes parsing. The first real API
         call (/auth/me, /usage, /jobs) then skips ~120-300 ms of
         DNS + TCP + TLS handshake — the browser already has an open
         connection waiting. Listed for prod + staging hostnames; both
         are harmless when not in use (the connection is opened
         optimistically and dropped if no request follows). dns-prefetch
         is the fallback for browsers that ignore preconnect. -->
    <link rel="preconnect" href="https://api.genly.pro" crossorigin>
    <link rel="dns-prefetch" href="https://api.genly.pro">
    <link rel="preconnect" href="https://api-staging-9b82.up.railway.app" crossorigin>
    <link rel="dns-prefetch" href="https://api-staging-9b82.up.railway.app">

  <body class="min-h-screen">
    <div id="root">
      <!-- Crawlable first-paint shell. React replaces it on mount; bots and
           no-JS clients still receive an accurate, factual product summary. -->
      <main id="_loader" style="min-height:100vh;display:grid;place-items:center;background:#080910;color:#f7f8fc;font-family:Inter,system-ui,sans-serif;padding:32px;">
        <section style="width:min(980px,100%);text-align:center;">
          <img src="/brand/genly-logo-white.svg" width="168" height="48" alt="GenLy AI" style="margin:0 auto 44px;max-width:46vw;height:auto;" />
          <p style="margin:0 0 18px;color:#9f8cff;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;">Dirección visual generativa para música</p>
          <h1 style="margin:0;font-size:clamp(46px,8vw,88px);line-height:.98;letter-spacing:-.055em;">Tu canción dirige el video.</h1>
          <p style="max-width:720px;margin:26px auto 0;color:#a7abba;font-size:18px;line-height:1.65;">GenLy transcribe y sincroniza la letra, construye una dirección visual con IA y permite controlar concepto, movimiento, color, efectos, tipografía y animación antes del render.</p>
          <p style="margin:25px 0 0;color:#757b8e;font-size:13px;">Lyric video Full HD · Short vertical · Thumbnail</p>
          <p id="_loader_msg" role="status" style="min-height:20px;color:#a7abba;font-size:12px;margin:28px 0 0;"></p>
        </section>
      </main>
    </div>
    <script>
      // If React hasn't mounted after 15s, keep the user informed and offer a
      // real recovery action. Slow corporate/VPN links can legitimately take
      // longer, so don't label the first delay as an application error.
      var _t = setTimeout(function() {
        var el = document.getElementById('_loader_msg');
        if (!el) return;
        el.textContent = 'La carga está tardando más de lo normal. ';
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.textContent = 'Reintentar';
        retry.style.cssText = 'margin-left:6px;padding:7px 12px;border:1px solid #9f8cff;border-radius:8px;background:transparent;color:#f7f8fc;cursor:pointer;font:inherit;font-weight:700;';
        retry.onclick = function() { window.location.reload(); };
        el.appendChild(retry);
      }, 15000);
      window.addEventListener('error', function(e) {
        clearTimeout(_t);
        var el = document.getElementById('_loader_msg');
        if (!el) return;
        // Resource-load errors (script/link) do not bubble. This listener is
        // registered in capture mode so a missing or filtered startup chunk is
        // no longer misreported as a generic timeout.
        var target = e.target;
        if (!e.message && target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          el.textContent = 'No se pudo descargar un archivo necesario. Revisá la conexión o el filtro de red y reintentá.';
          return;
        }
        el.textContent = 'JS Error: ' + (e.message || 'desconocido') + ' — ' + (e.filename || '');
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('_loader_msg');
        if (el && !el.textContent) el.textContent = 'Promise error: ' + String(e.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>

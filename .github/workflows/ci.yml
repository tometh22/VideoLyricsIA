name: CI

on:
  push:
    branches: [main, staging, claude/*]
  # Stacked PRs use another feature branch as their temporary base. Running
  # CI only for main/staging left those exact heads without backend coverage.
  pull_request:

jobs:
  # ─── Backend tests ───
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyricgen/backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genly
          POSTGRES_PASSWORD: genly
          POSTGRES_DB: genly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lyricgen/backend/requirements.txt

      # ffmpeg (Debian build ships with libass → the `subtitles` filter).
      # Without it the end-to-end render test (test_ass_integration_render.py)
      # SKIPS, so a broken libass title-card / overlay burn could ship
      # unnoticed — the 2026-05 title-card fix (overflow + floating accents)
      # is only truly gated when this burns a real MP4. ~5s on a warm runner.
      - name: Install ffmpeg (libass for the render gate)
        run: |
          # GitHub's bash uses pipefail; grep -q can close the pipe early and
          # make ffmpeg exit with SIGPIPE, falsely forcing the apt fallback.
          ffmpeg_filters="$(ffmpeg -hide_banner -filters 2>/dev/null || true)"
          if command -v ffmpeg >/dev/null 2>&1 && \
             grep -qE '[[:space:]]subtitles[[:space:]]' <<<"$ffmpeg_filters"; then
            echo "ffmpeg with the subtitles/libass filter is already available"
          else
            sudo apt-get install -y ffmpeg || {
              sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
              sudo apt-get install -y ffmpeg
            }
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff

      # Lint gate contra shipping NameErrors al prod. INCIDENT 2026-05-26:
      # el PR `0bcc936 feat(lyrics): color customizable` shipeó 3 NameErrors
      # encadenados (`re`, `lyric_color`, `lyric_sung_color`) que bloquearon
      # `/generate` en prod por ~17 horas. Cada parche destapaba el siguiente.
      # `pyflakes F821` (undefined-name) los habría atrapado los 3 acá.
      #
      # `--select F821` es chirurgical: solo undefined-name, no toca otras
      # reglas. Cero ruido para el equipo. Si necesitamos lint más amplio
      # en el futuro (F841 unused-var, F811 redefined, etc.), agregamos
      # reglas a esa lista — hoy esto ya cierra la causa raíz del
      # incidente.
      #
      # Corre ANTES de pytest porque es fail-fast: ~5 s vs ~5 min de
      # pytest. Sin sentido correr tests si hay nombres no definidos que
      # ningún import resuelve.
      - name: Lint — undefined names (F821, prevent NameError shipping)
        run: ruff check --select F821 .

      # Gate de migraciones, fail-fast (2026-08-29). El paso de Postgres de
      # abajo YA detecta una colisión de revision id — pero recién después de
      # levantar el servicio Postgres. Esto corre en segundos, sin servicios,
      # y además cubre una brecha que aquél no ve: `alembic heads` devuelve
      # exit 0 con MÚLTIPLES heads, así que un branch de migraciones sólo se
      # manifiesta como un "Multiple head revisions" confuso más adelante.
      #
      # Origen: un PR usó `a1b2c3d4e5f6` como revision id sin notar que ya
      # existía (`cost_snapshots`). Alembic lo reporta como "Cycle is detected
      # in revisions", no como colisión, y rompe TODAS las migraciones — no
      # sólo la nueva. Usar siempre `alembic revision` para generar el id.
      - name: Migrations — head único + upgrade sobre sqlite limpio
        env:
          DATABASE_URL: "sqlite:////tmp/ci_migration_check.db"
        run: |
          set -euo pipefail
          rm -f /tmp/ci_migration_check.db
          n_heads=$(python -m alembic heads | grep -c '(head)' || true)
          if [ "$n_heads" -ne 1 ]; then
            echo "::error::Se esperaba exactamente 1 head de alembic, hay $n_heads."
            echo "Un revision id duplicado o un branch de migraciones rompe el"
            echo "prod_migrate.sh que corre antes de cada deploy. Detalle:"
            python -m alembic heads
            exit 1
          fi
          python -m alembic upgrade head

      - name: Apply migrations on real PostgreSQL
        env:
          DATABASE_URL: "postgresql://genly:genly@localhost:5432/genly_test"
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://genly:genly@localhost:5432/genly_test"
          JWT_SECRET: "ci-test-secret-key"
          ADMIN_PASSWORD: "testadmin123"
        # `-rs` lista el motivo de cada skip; el paso siguiente lo audita.
        run: python -m pytest tests/ -v --tb=short -rs | tee /tmp/pytest_out.txt; exit ${PIPESTATUS[0]}

      # Un test saltado en silencio es PEOR que uno en rojo: el job sale verde
      # sin haber ejercitado nada. Pasó el 2026-08-29 — un archivo con
      # `async def test_` + `@pytest.mark.asyncio` se saltó entero porque
      # `pytest-asyncio` no está en requirements.txt. Cuatro tests de una
      # regresión de producción no corrieron y el PR figuraba en verde.
      #
      # Un skip DELIBERADO (`@pytest.mark.skip`/`skipif`, `pytest.skip()`) es
      # legítimo y pasa. Lo que rompe el build es el skip por infraestructura:
      # plugin ausente, import fallido, módulo faltante.
      - name: Tests — ningún skip por infraestructura
        run: |
          set -uo pipefail
          if [ ! -f /tmp/pytest_out.txt ]; then
            echo "::error::no se encontró la salida de pytest"; exit 1
          fi
          malos=$(grep -E "^SKIPPED" /tmp/pytest_out.txt \
                  | grep -Ei "not natively supported|could not import|No module named|failed to import" \
                  || true)
          if [ -n "$malos" ]; then
            echo "::error::Hay tests saltados por infraestructura (plugin/import), no por decisión."
            echo "$malos"
            echo ""
            echo "Un skip así deja el job en verde sin ejercitar el código."
            echo "Arreglalo instalando la dependencia o reescribiendo el test,"
            echo "no agregando un skip explícito."
            exit 1
          fi
          echo "OK — sin skips por infraestructura"

      - name: Real MoviePy + libass render gates
        env:
          DATABASE_URL: "postgresql://genly:genly@localhost:5432/genly_test"
          JWT_SECRET: "ci-test-secret-key"
          ADMIN_PASSWORD: "testadmin123"
          GENLY_TEST_REAL_MOVIEPY: "1"
        run: >-
          python -m pytest tests/test_ass_integration.py
          tests/test_ass_integration_render.py -v --tb=short

      - name: Dependency vulnerability gate
        run: |
          pip install pip-audit
          python scripts/security_audit.py

      - name: Syntax check all modules
        run: |
          python -c "
          import ast, glob
          for f in glob.glob('*.py'):
              ast.parse(open(f).read())
              print(f'{f}: OK')
          "

  # ─── Frontend build ───
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyricgen/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lyricgen/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=moderate

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # ─── Editor 2.0 real collaboration gate ───
  # Runs separately from the fast mocked browser suite: two authenticated
  # Chromium contexts share one real PostgreSQL-backed editor document.
  editor-collaboration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://genly:genly@127.0.0.1:5432/genly_editor_e2e
      JWT_SECRET: editor-e2e-ci-secret
      ADMIN_PASSWORD: testadmin123
      ENVIRONMENT: test
      CORS_ORIGINS: http://127.0.0.1:4173
      RATE_LIMIT_ENABLED: "false"
      BACKGROUND_THREADS_ENABLED: "false"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genly
          POSTGRES_PASSWORD: genly
          POSTGRES_DB: genly_editor_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lyricgen/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lyricgen/frontend/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          pip install -r lyricgen/backend/requirements.txt
          npm ci --prefix lyricgen/frontend
          cd lyricgen/frontend
          npx playwright install --with-deps chromium
      - name: Seed and start real editor API
        run: |
          cd lyricgen/backend
          python scripts/seed_editor_e2e.py
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/editor-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health/live
      - name: Run two-user Chromium collaboration flow
        working-directory: lyricgen/frontend
        env:
          REAL_EDITOR_E2E: "1"
          REAL_EDITOR_API: http://127.0.0.1:8000
          VITE_API_URL: http://127.0.0.1:8000
        run: npx playwright test e2e/editor-collaboration-real.spec.js
      - name: Upload editor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-collaboration-diagnostics
          path: |
            /tmp/editor-api.log
            lyricgen/frontend/test-results

  # ─── Sentinel security tests ───
  sentinel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sentinel/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Sentinel security tests
        run: pytest -q test_sentinel.py

  # ─── Docker build ───
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, editor-collaboration, sentinel]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          cd lyricgen
          docker build -t genly-api:${{ github.sha }} .

      - name: Build worker Docker image
        run: |
          cd lyricgen
          docker build -f Dockerfile.worker -t genly-worker:${{ github.sha }} .

      # Uncomment when you have a container registry:
      # - name: Login to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push image
      #   run: |
      #     docker tag genly-ai:${{ github.sha }} ghcr.io/${{ github.repository }}/genly-ai:latest
      #     docker push ghcr.io/${{ github.repository }}/genly-ai:latest

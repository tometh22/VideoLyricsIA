name: CI

on:
  push:
    branches: [main, staging, claude/*]
  pull_request:
    branches: [main, staging]

jobs:
  # ─── Backend tests ───
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyricgen/backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genly
          POSTGRES_PASSWORD: genly
          POSTGRES_DB: genly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lyricgen/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff

      # Lint gate contra shipping NameErrors al prod. INCIDENT 2026-05-26:
      # el PR `0bcc936 feat(lyrics): color customizable` shipeó 3 NameErrors
      # encadenados (`re`, `lyric_color`, `lyric_sung_color`) que bloquearon
      # `/generate` en prod por ~17 horas. Cada parche destapaba el siguiente.
      # `pyflakes F821` (undefined-name) los habría atrapado los 3 acá.
      #
      # `--select F821` es chirurgical: solo undefined-name, no toca otras
      # reglas. Cero ruido para el equipo. Si necesitamos lint más amplio
      # en el futuro (F841 unused-var, F811 redefined, etc.), agregamos
      # reglas a esa lista — hoy esto ya cierra la causa raíz del
      # incidente.
      #
      # Corre ANTES de pytest porque es fail-fast: ~5 s vs ~5 min de
      # pytest. Sin sentido correr tests si hay nombres no definidos que
      # ningún import resuelve.
      - name: Lint — undefined names (F821, prevent NameError shipping)
        run: ruff check --select F821 .

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://genly:genly@localhost:5432/genly_test"
          JWT_SECRET: "ci-test-secret-key"
          ADMIN_PASSWORD: "testadmin123"
        run: python -m pytest tests/ -v --tb=short

      - name: Syntax check all modules
        run: |
          python -c "
          import ast, glob
          for f in glob.glob('*.py'):
              ast.parse(open(f).read())
              print(f'{f}: OK')
          "

  # ─── Frontend build ───
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyricgen/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lyricgen/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ─── Docker build ───
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd lyricgen
          docker build -t genly-ai:${{ github.sha }} .

      # Uncomment when you have a container registry:
      # - name: Login to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push image
      #   run: |
      #     docker tag genly-ai:${{ github.sha }} ghcr.io/${{ github.repository }}/genly-ai:latest
      #     docker push ghcr.io/${{ github.repository }}/genly-ai:latest

name: CI

on:
  push:
    branches: [main, staging, claude/*]
  # Stacked PRs use another feature branch as their temporary base. Running
  # CI only for main/staging left those exact heads without backend coverage.
  pull_request:
  # Required for GitHub merge queues.  A queued PR is tested at the synthetic
  # merge commit, not at the pull_request SHA.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A new push replaces obsolete PR work, but merge-group and branch builds are
# never cancelled: they represent the exact commit that may be merged/deployed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast fail (<10 min target) for pull-request heads.  This is additive while
  # the repository is user-owned and cannot enable GitHub merge queue: the
  # existing full `backend` + `frontend` PR gates remain active.  After the
  # queue activation sequence in docs/CI_MERGE_QUEUE.md, the repository
  # variable STAGING_MERGE_QUEUE_ENABLED=true moves the full suite exclusively
  # to merge_group/push while `ci-gate` keeps this fast check as the PR gate.
  backend_fast:
    name: backend-fast
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lyricgen/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lyricgen/backend/requirements.txt

      # Keep this dependency set deliberately small.  The full requirements
      # (including torch) belong to the merge-group suite below.
      - name: Install fast-gate dependencies
        run: >-
          pip install ruff
          'sqlalchemy>=2.0.0,<3.0.0'
          'alembic>=1.13.0,<2.0.0'

      - name: Lint — undefined names (F821)
        run: ruff check --select F821 .

      - name: Compile every Python source
        run: python -m compileall -q .

      - name: Require one Alembic head
        env:
          DATABASE_URL: sqlite://
        run: |
          heads="$(python -m alembic heads)"
          printf '%s\n' "$heads"
          test "$(grep -c '(head)' <<<"$heads")" -eq 1

  # ─── Backend tests ───
  backend:
    # Compatibility mode is fail-safe: until merge queue is proven and the
    # repository variable is explicitly enabled, full CI still runs on PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref != 'staging' ||
      vars.STAGING_MERGE_QUEUE_ENABLED != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyricgen/backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genly
          POSTGRES_PASSWORD: genly
          POSTGRES_DB: genly_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lyricgen/backend/requirements.txt

      # ffmpeg (Debian build ships with libass → the `subtitles` filter).
      # Without it the end-to-end render test (test_ass_integration_render.py)
      # SKIPS, so a broken libass title-card / overlay burn could ship
      # unnoticed — the 2026-05 title-card fix (overflow + floating accents)
      # is only truly gated when this burns a real MP4. ~5s on a warm runner.
      - name: Install ffmpeg (libass for the render gate)
        run: |
          # GitHub's bash uses pipefail; grep -q can close the pipe early and
          # make ffmpeg exit with SIGPIPE, falsely forcing the apt fallback.
          ffmpeg_filters="$(ffmpeg -hide_banner -filters 2>/dev/null || true)"
          if command -v ffmpeg >/dev/null 2>&1 && \
             grep -qE '[[:space:]]subtitles[[:space:]]' <<<"$ffmpeg_filters"; then
            echo "ffmpeg with the subtitles/libass filter is already available"
          else
            sudo apt-get install -y ffmpeg || {
              sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
              sudo apt-get install -y ffmpeg
            }
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff

      # Lint gate contra shipping NameErrors al prod. INCIDENT 2026-05-26:
      # el PR `0bcc936 feat(lyrics): color customizable` shipeó 3 NameErrors
      # encadenados (`re`, `lyric_color`, `lyric_sung_color`) que bloquearon
      # `/generate` en prod por ~17 horas. Cada parche destapaba el siguiente.
      # `pyflakes F821` (undefined-name) los habría atrapado los 3 acá.
      #
      # `--select F821` es chirurgical: solo undefined-name, no toca otras
      # reglas. Cero ruido para el equipo. Si necesitamos lint más amplio
      # en el futuro (F841 unused-var, F811 redefined, etc.), agregamos
      # reglas a esa lista — hoy esto ya cierra la causa raíz del
      # incidente.
      #
      # Corre ANTES de pytest porque es fail-fast: ~5 s vs ~5 min de
      # pytest. Sin sentido correr tests si hay nombres no definidos que
      # ningún import resuelve.
      - name: Lint — undefined names (F821, prevent NameError shipping)
        run: ruff check --select F821 .

      - name: Apply migrations on real PostgreSQL
        env:
          DATABASE_URL: "postgresql://genly:genly@localhost:5432/genly_test"
        run: python -m alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: "postgresql://genly:genly@localhost:5432/genly_test"
          JWT_SECRET: "ci-test-secret-key"
          ADMIN_PASSWORD: "testadmin123"
        run: python -m pytest tests/ -v --tb=short

      - name: Real MoviePy + libass render gates
        env:
          DATABASE_URL: "postgresql://genly:genly@localhost:5432/genly_test"
          JWT_SECRET: "ci-test-secret-key"
          ADMIN_PASSWORD: "testadmin123"
          GENLY_TEST_REAL_MOVIEPY: "1"
        run: >-
          python -m pytest tests/test_ass_integration.py
          tests/test_ass_integration_render.py -v --tb=short

      - name: Dependency vulnerability gate
        run: |
          pip install pip-audit
          python scripts/security_audit.py

      - name: Syntax check all modules
        run: |
          python -c "
          import ast, glob
          for f in glob.glob('*.py'):
              ast.parse(open(f).read())
              print(f'{f}: OK')
          "

  # ─── Frontend build ───
  frontend:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref != 'staging' ||
      vars.STAGING_MERGE_QUEUE_ENABLED != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lyricgen/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lyricgen/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # This is pre-existing frontend dependency debt, tracked separately in
      # https://github.com/tometh22/VideoLyricsIA/issues/1242. Keep the audit
      # visible in CI, but do not let it block backend/eval PRs while that
      # issue is being resolved. Tests, E2E, and the production build remain
      # blocking checks.
      - name: Dependency vulnerability audit (tracked, non-blocking)
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build

  # ─── Editor 2.0 real collaboration gate ───
  # Runs separately from the fast mocked browser suite: two authenticated
  # Chromium contexts share one real PostgreSQL-backed editor document.
  editor-collaboration:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref != 'staging' ||
      vars.STAGING_MERGE_QUEUE_ENABLED != 'true'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://genly:genly@127.0.0.1:5432/genly_editor_e2e
      JWT_SECRET: editor-e2e-ci-secret
      ADMIN_PASSWORD: testadmin123
      ENVIRONMENT: test
      CORS_ORIGINS: http://127.0.0.1:4173
      RATE_LIMIT_ENABLED: "false"
      BACKGROUND_THREADS_ENABLED: "false"
      REAL_REVIEWER_E2E: "1"
      BATCH_CAMPAIGN_ENABLED: "1"
      BATCH_CAMPAIGN_SCOPES: editor_e2e_team
      REVIEWER_ASSIST_ENABLED: "1"
      REVIEWER_ASSIST_PUBLISH_ENABLED: "1"
      REVIEWER_ASSIST_INFERENCE_ENABLED: "0"
      REVIEWER_ASSIST_CAMPAIGN_ID: e2erevcamp01
      REVIEWER_CANDIDATE_STORAGE: local
      REVIEWER_ASSIST_CACHE_DIR: /tmp/reviewer-e2e-cache
      QUALITY_OPERATOR_SUGGESTIONS_ENABLED: "1"
      QUALITY_TIMING_OPERATOR_SUGGESTIONS_ENABLED: "0"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: genly
          POSTGRES_PASSWORD: genly
          POSTGRES_DB: genly_editor_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: lyricgen/backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: lyricgen/frontend/package-lock.json
      - name: Install backend and frontend dependencies
        run: |
          pip install -r lyricgen/backend/requirements.txt
          npm ci --prefix lyricgen/frontend
          cd lyricgen/frontend
          npx playwright install --with-deps chromium
      - name: Seed and start real editor API
        run: |
          cd lyricgen/backend
          python scripts/seed_editor_e2e.py
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/editor-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health/live
      - name: Run collaboration and supervised candidate flows in isolated PostgreSQL
        working-directory: lyricgen/frontend
        env:
          REAL_EDITOR_E2E: "1"
          REAL_EDITOR_API: http://127.0.0.1:8000
          VITE_API_URL: http://127.0.0.1:8000
        run: npx playwright test e2e/editor-collaboration-real.spec.js e2e/reviewer-real.spec.js
      - name: Upload editor diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-collaboration-diagnostics
          path: |
            /tmp/editor-api.log
            lyricgen/frontend/test-results

  # ─── Sentinel security tests ───
  sentinel:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref != 'staging' ||
      vars.STAGING_MERGE_QUEUE_ENABLED != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentinel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: sentinel/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Sentinel security tests
        run: pytest -q test_sentinel.py

  # ─── Docker build ───
  docker:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.base_ref != 'staging' ||
       vars.STAGING_MERGE_QUEUE_ENABLED != 'true') &&
      needs.backend.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs['editor-collaboration'].result == 'success' &&
      needs.sentinel.result == 'success'
    runs-on: ubuntu-latest
    needs: [backend, frontend, editor-collaboration, sentinel]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: |
          cd lyricgen
          docker build -t genly-api:${{ github.sha }} .

      - name: Build worker Docker image
        run: |
          cd lyricgen
          docker build -f Dockerfile.worker -t genly-worker:${{ github.sha }} .

      # Uncomment when you have a container registry:
      # - name: Login to registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push image
      #   run: |
      #     docker tag genly-ai:${{ github.sha }} ghcr.io/${{ github.repository }}/genly-ai:latest
      #     docker push ghcr.io/${{ github.repository }}/genly-ai:latest

  # One stable required context for both event types.  Required checks are
  # coupled across pull_request and merge_group, so requiring `backend-fast`
  # directly would deadlock the queue.  `ci-gate` instead means:
  #   pull_request (queue enabled): backend-fast passed;
  #   merge_group / protected-branch push: every full-suite job passed.
  ci_gate:
    name: ci-gate
    if: always()
    runs-on: ubuntu-latest
    needs: [backend_fast, backend, frontend, editor-collaboration, sentinel, docker]
    env:
      EVENT_NAME: ${{ github.event_name }}
      BASE_REF: ${{ github.base_ref }}
      MERGE_QUEUE_ENABLED: ${{ vars.STAGING_MERGE_QUEUE_ENABLED }}
      BACKEND_FAST_RESULT: ${{ needs.backend_fast.result }}
      BACKEND_RESULT: ${{ needs.backend.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      EDITOR_RESULT: ${{ needs['editor-collaboration'].result }}
      SENTINEL_RESULT: ${{ needs.sentinel.result }}
      DOCKER_RESULT: ${{ needs.docker.result }}
    steps:
      - name: Enforce the event-specific quality gate
        run: |
          python - <<'PY'
          import os

          event = os.environ["EVENT_NAME"]
          queue_enabled = (
              os.environ.get("BASE_REF") == "staging"
              and os.environ.get("MERGE_QUEUE_ENABLED", "").lower() == "true"
          )
          fast = os.environ["BACKEND_FAST_RESULT"]
          full = {
              "backend": os.environ["BACKEND_RESULT"],
              "frontend": os.environ["FRONTEND_RESULT"],
              "editor-collaboration": os.environ["EDITOR_RESULT"],
              "sentinel": os.environ["SENTINEL_RESULT"],
              "docker": os.environ["DOCKER_RESULT"],
          }

          failures = []
          if event == "pull_request":
              if fast != "success":
                  failures.append(f"backend-fast={fast}")
              if not queue_enabled:
                  failures.extend(
                      f"{name}={result}"
                      for name, result in full.items()
                      if result != "success"
                  )
          else:
              failures.extend(
                  f"{name}={result}"
                  for name, result in full.items()
                  if result != "success"
              )

          if failures:
              raise SystemExit("CI gate failed: " + ", ".join(failures))

          mode = "PR fast gate" if event == "pull_request" and queue_enabled else "full suite"
          print(f"CI gate passed ({mode}; event={event})")
          PY

name: Reporte operativo diario UMG

on:
  schedule:
    # 03:00 UTC = 00:00 ART: reporta el día que acaba de cerrar.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet psycopg2-binary==2.9.9 requests==2.32.3
      - name: Generar y enviar
        working-directory: lyricgen/backend
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}   # usuario de solo lectura (staging)
          DELIVERIES_DATABASE_URL: ${{ secrets.DATABASE_URL }}        # ya existe (producción)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python scripts/report_ops_daily.py --date "$(TZ=America/Argentina/Buenos_Aires date -d yesterday +%F)" --send

# Golden renders nocturnos — regresión visual del pipeline de render.
#
# Renderiza la matriz fija de scripts/golden_render.py contra STAGING y
# compara frames del video Y el short contra los masters dorados del repo.
# Cualquier cambio visual no intencional (fuente, peso, color, layout,
# fondo) rompe el workflow → notificación de GitHub antes de que un
# cliente lo vea. Nació de la semana 2026-06-08/12: tres defectos
# visuales llegaron al cliente porque ningún test miraba el artefacto
# final.
#
# Re-bendecir goldens tras un cambio visual INTENCIONAL:
#   correr este workflow a mano con bless=true, bajar el artifact
#   "golden-frames" y commitearlo en lyricgen/backend/tests/golden_frames/
#   (o local: python3 scripts/golden_render.py --base-url ... --bless)
name: golden-render

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 Argentina — staging sin actividad
  workflow_dispatch:
    inputs:
      bless:
        description: "Regenerar goldens (true) en vez de comparar"
        required: false
        default: "false"

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (ffmpeg + pillow)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install --quiet pillow

      - name: Golden render vs staging
        working-directory: lyricgen/backend
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.bless }}" = "true" ]; then EXTRA="--bless"; fi
          python3 scripts/golden_render.py \
            --base-url https://api-staging-9b82.up.railway.app $EXTRA

      - name: Subir diffs si hay regresión
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: lyricgen/backend/golden_diffs/
          if-no-files-found: ignore

      - name: Subir goldens nuevos (modo bless)
        if: github.event.inputs.bless == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golden-frames
          path: lyricgen/backend/tests/golden_frames/
